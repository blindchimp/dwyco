plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dwyco.kfoo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dwyco.kfoo'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            // libdwyco_jni.so is prebuilt for all four ABIs
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                // the bridge is plain C and has no C++ runtime of its own;
                // libdwyco_jni.so brings its own libc++_shared.so at runtime.
                arguments '-DANDROID_STL=none'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '27.2.12479018'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            // needed so the prebuilt libs are extracted uncompressed
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
}
